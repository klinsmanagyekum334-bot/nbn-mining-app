<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Details - NBN Mining</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #23202b; display: flex; justify-content: center; min-height: 100vh; color: #e2e8f0; }
        .app-container { width: 100%; max-width: 414px; background-color: #1c1824; min-height: 100vh; padding: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.1); }

        .header { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; padding-top: 10px; }
        .header h1 { font-size: 22px; font-weight: 800; color: #fbbf24; }
        .back-btn { font-size: 24px; text-decoration: none; color: #fbbf24; }

        .detail-card { background: linear-gradient(135deg, #fef08a 0%, #eab308 100%); padding: 25px; border-radius: 16px; box-shadow: 0 10px 20px rgba(202, 138, 4, 0.2); color: #422006; }
        .detail-header { border-bottom: 1px solid rgba(66, 32, 6, 0.2); padding-bottom: 15px; margin-bottom: 20px; }
        .detail-header h2 { font-size: 22px; font-weight: 800; margin-bottom: 5px; }
        .detail-header p { font-size: 14px; font-weight: 600; opacity: 0.8; }

        .detail-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: rgba(255,255,255,0.3); padding: 15px; border-radius: 10px; }
        .detail-row .label { font-size: 15px; font-weight: 700; }
        .detail-row .value { font-size: 22px; font-weight: 800; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <a href="/earnings" class="back-btn">←</a>
            <h1>Report Details</h1>
        </div>

        <div class="detail-card">
            <div class="detail-header">
                <h2>{{ display_date }}</h2>
                <p>{{ day_name }}</p>
            </div>
            
            <div class="detail-row">
                <div class="label">Gold acquired</div>
                <div class="value">{{ record['grams'] }}g</div>
            </div>
            
            <div class="detail-row">
                <div class="label">Amount</div>
                <div class="value">GH₵ {{ "%.2f"|format(record['amount']) }}</div>
            </div>
        </div>
    </div>
</body>
</html>
