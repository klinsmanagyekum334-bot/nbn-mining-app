<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading - NBN Mining</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; width: 100%; background-color: #1c1824; overflow: hidden; }
        
        .splash-container { width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .splash-image { width: 100%; height: 100%; object-fit: cover; opacity: 0; animation: fadeIn 1s forwards; }
        
        /* Optional loading spinner at the bottom */
        .loading-bar { position: absolute; bottom: 50px; width: 50px; height: 50px; border: 4px solid rgba(251, 191, 36, 0.3); border-top: 4px solid #fbbf24; border-radius: 50%; animation: spin 1s linear infinite; }
        
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="splash-container">
        <img src="/static/mining4.jpg" alt="NBN Mining Splash" class="splash-image">
        <div class="loading-bar"></div>
    </div>

    <script>
        // Wait 4 seconds (4000 milliseconds) then redirect to login
        setTimeout(function() {
            window.location.href = "/login";
        }, 4000);
    </script>
</body>
</html>
